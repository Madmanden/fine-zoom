<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <span class="icon">🅩</span>
      <h1>Text Zoom</h1>
    </header>
    
    <div class="zoom-display">
      <span id="zoomLevel">1.00x</span>
    </div>
    
    <div class="slider-container">
      <input type="range" id="zoomSlider" min="0.5" max="3.0" step="0.05" value="1.0">
    </div>
    
    <div class="buttons-row">
      <button id="zoomOut" class="zoom-btn" aria-label="Zoom out">−</button>
      <button id="zoomIn" class="zoom-btn" aria-label="Zoom in">+</button>
    </div>

    <div class="fine-buttons-row">
      <button id="fineZoomOut" class="fine-zoom-btn" aria-label="Fine zoom out (0.01)">−</button>
      <button id="fineZoomIn" class="fine-zoom-btn" aria-label="Fine zoom in (0.01)">+</button>
    </div>
    
    <div class="method-selector">
      <label for="zoomMethod">Method:</label>
      <select id="zoomMethod">
        <option value="browser-zoom">Browser Zoom (Native Page Scale)</option>
        <option value="font-size">Font Size (Text Only)</option>
        <option value="css-zoom">CSS Zoom (Page Scale)</option>
      </select>
    </div>
    
    <div class="actions">
      <button id="resetBtn" class="reset-btn">Reset</button>
      <button id="settingsBtn" class="settings-btn" title="Advanced Settings">⚙</button>
    </div>
  </div>
  
  <script src="../shared/constants.js"></script>
  <script src="../shared/utils.js"></script>
  <script src="popup.js"></script>
</body>
</html>
